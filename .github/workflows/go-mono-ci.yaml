name: Go Monorepo CI
on:
  pull_request:
    branches:
      - '**'

env:
  GO_VERSION: 1.26.1

jobs:
  # Scan the monorepo for Go modules
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        shell: bash
        run: bash ./.github/scripts/discover-go-modules.sh

  # Lint using golangci-lint
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: ${{ matrix.module }}
  
  # If lint passes, run tests
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [discover, lint]
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -v ./...
        working-directory: ${{ matrix.module }}