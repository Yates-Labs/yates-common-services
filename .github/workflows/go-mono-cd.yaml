name: Go Monorepo CD
on:
  push:
    branches:
      - main

env:
  GO_VERSION: 1.26.1

jobs:
  discover:
    # Scan the monorepo for Go modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        shell: bash
        run: bash ./.github/scripts/discover-go-modules.sh

  # Run parallelized releases for each module discovered
  release:
    runs-on: ubuntu-latest
    needs: discover
    permissions:
      contents: write
    strategy:
      matrix:
        # Populate the execution loop directly from the discovery job step output
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # CRITICAL: Ensure full history is loaded to parse older git tags

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Semantic Release for ${{ matrix.module }}
        uses: go-semantic-release/action@v1
        with:
          hooks: goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Map variables to trigger Directory Mode paths natively
          GSR_MONOREPO_PATH: ${{ matrix.module }}
          GSR_TAG_PREFIX: ${{ matrix.module }}/